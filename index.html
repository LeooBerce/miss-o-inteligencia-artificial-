<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caminho para o Hexa - Imersão IA Alura</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(#006400, #000080);
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            border: 4px solid #FFD700;
        }
        h1 {
            color: #FFD700;
            text-shadow: 0 0 10px #00FF00;
        }
        .story {
            text-align: left;
            line-height: 1.6;
            margin: 25px 0;
            font-size: 1.1em;
        }
        button {
            background: #FFD700;
            color: #006400;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #00FF00;
            transform: scale(1.05);
        }
        img {
            max-width: 100%;
            border-radius: 12px;
            margin: 20px 0;
            border: 3px solid #FFD700;
        }
        .ending {
            font-size: 1.3em;
            padding: 20px;
            border: 5px solid #FFD700;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏆 CAMINHO PARA O HEXA</h1>
        <p><strong>Uma aventura interativa da Copa do Mundo 2026 • Imersão IA Alura</strong></p>

        <div id="content">
            <!-- História inicial será inserida via JS -->
        </div>

        <div id="choices"></div>
    </div>

    <script>
        const story = {
            start: {
                text: `
                    <p class="story">Era 2026. A Copa do Mundo estava acontecendo e o Brasil sonhava com o hexa. Você é Alex, analista da Seleção Brasileira. O time contava com Neymar, Vinícius Júnior e o jovem Endrick.</p>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/NY_NJ_Stadium_Brazil_V_Morocco_13_June_2026-59.jpg" alt="Estádio lotado na Copa 2026">
                    <p class="story">Primeira fase: vitórias convincentes contra Inglaterra, Senegal e Irã. O time chega às oitavas com moral.</p>
                `,
                choices: [
                    { text: "Reforçar a marcação com rodízio", next: "quartas" },
                    { text: "Apostar no ataque total", next: "quartas" }
                ]
            },
            quartas: {
                text: `
                    <p class="story">Nas quartas, contra a França, foi um jogo épico. Neymar deu um passe de calcanhar genial para Vinícius Júnior abrir o placar. Endrick virou o jogo. Brasil classificado!</p>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d5/Confed.Cup2013Champions.jpg" alt="Seleção celebrando">
                    <p class="story">Você percebeu que o meio-campo cansava. A semi-final contra a Alemanha seria decisiva.</p>
                `,
                choices: [
                    { text: "Continuar para a semifinal", next: "semifinal" }
                ]
            },
            semifinal: {
                text: `
                    <p class="story">Na semifinal, o Brasil enfrentou a Alemanha. Após um primeiro tempo tenso, Neymar fez um gol de falta incrível e Endrick selou a vitória por 2x0. O Brasil estava na FINAL contra a Argentina!</p>
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Stade_de_Lusail_match_Brazil_vs_Serbia.jpg" alt="Brasil em campo">
                `,
                choices: [
                    { text: "Ir para a Final - Buscar o Hexa", next: "final_hexa" },
                    { text: "Ir para a Final - Rivalidade máxima", next: "final_derrota" }
                ]
            },
            final_hexa: {
                text: `
                    <div class="ending">
                        <h2>🏆 O HEXA CHEGOU!</h2>
                        <p class="story">Na grande final, a Argentina abriu o placar, mas o Brasil reagiu. Neymar empatou, Vinícius Júnior virou de pênalti e Endrick fechou o placar em 3x1. O Brasil é hexacampeão do mundo!</p>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/FIFA_World_Cup_Trophy_%28Ank_Kumar%2C_Infosys_Limited%29_01.jpg/960px-FIFA_World_Cup_Trophy_%28Ank_Kumar%2C_Infosys_Limited%29_01.jpg" alt="Taça do Hexa">
                        <p class="story">Neymar chorando, Vini Jr dançando, Endrick sendo carregado. O país inteiro celebra nas ruas com verde, amarelo e azul.</p>
                        <p><strong>Final Feliz - Hexa conquistado!</strong></p>
                    </div>
                `,
                choices: []
            },
            final_derrota: {
                text: `
                    <div class="ending">
                        <h2>😔 Derrota na Final</h2>
                        <p class="story">A Argentina saiu na frente e conseguiu segurar o resultado. Apesar da garra de Neymar, Vini Jr e Endrick, o placar terminou 1x3. O hexa não veio dessa vez.</p>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Mineirao_Stadium.jpg" alt="Jogo tenso">
                        <p class="story">No vestiário, o time se uniu. Neymar consolou os jovens. A lição ficou: o futebol ensina superação. O Brasil já pensa no próximo ciclo.</p>
                        <p><strong>Final Alternativo - Lição de resiliência</strong></p>
                    </div>
                `,
                choices: []
            }
        };

        function loadScene(sceneKey) {
            const scene = story[sceneKey];
            document.getElementById('content').innerHTML = scene.text;
            
            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';
            
            scene.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.textContent = choice.text;
                btn.onclick = () => loadScene(choice.next);
                choicesDiv.appendChild(btn);
            });
        }

        // Iniciar o jogo
        loadScene('start');
    </script>
</body>
</html>
